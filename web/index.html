<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usakame Retro Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            color: #fff1e8;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #glcanvas {
            width: min(90vw, 90vh, 640px);
            height: min(90vw, 90vh, 640px);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #5f574f;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            background: #000000;
            outline: none;
        }
        #status {
            margin-top: 8px;
            font-size: 12px;
            color: #c2c3c7;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="status">Usakame Retro Engine (256x256) - Click canvas to focus</div>
    <script>
        (function () {
            const audioContexts = [];
            const OrigAC = window.AudioContext || window.webkitAudioContext;
            if (OrigAC) {
                const WrappedAC = function (...args) {
                    const ctx = new OrigAC(...args);
                    audioContexts.push(ctx);
                    return ctx;
                };
                WrappedAC.prototype = OrigAC.prototype;
                if (window.AudioContext) window.AudioContext = WrappedAC;
                if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
            }
            const resumeAudio = function () {
                for (let i = 0; i < audioContexts.length; i++) {
                    const ctx = audioContexts[i];
                    if (ctx && ctx.state === "suspended") {
                        ctx.resume().catch(() => {});
                    }
                }
            };
            ["keydown", "mousedown", "pointerdown", "touchstart", "click"].forEach((ev) => {
                window.addEventListener(ev, resumeAudio, { capture: true, passive: true });
            });
        })();
    </script>
    <script src="mq_js_bundle.js"></script>
    <script>
        (function () {
            const te = typeof TextEncoder !== "undefined" ? new TextEncoder() : null;
            let cacheKey = null;
            let cacheBytes = null;
            function encodeUtf8(s) {
                if (te) return te.encode(s);
                const arr = [];
                for (let i = 0; i < s.length; i++) {
                    let c = s.charCodeAt(i);
                    if (c < 128) arr.push(c);
                    else if (c < 2048) arr.push(192 | (c >> 6), 128 | (c & 63));
                    else if (c < 55296 || c >= 57344) arr.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
                    else {
                        i++;
                        c = 65536 + (((c & 1023) << 10) | (s.charCodeAt(i) & 1023));
                        arr.push(240 | (c >> 18), 128 | ((c >> 12) & 63), 128 | ((c >> 6) & 63), 128 | (c & 63));
                    }
                }
                return new Uint8Array(arr);
            }
            if (typeof miniquad_add_plugin === "function") {
                miniquad_add_plugin({
                    register_plugin: function (importObj) {
                        importObj.env.uk_storage_get_len = function (kp, kl) {
                            try {
                                const k = UTF8ToString(kp, kl);
                                const v = window.localStorage.getItem(k);
                                if (v === null) return -1;
                                cacheKey = k;
                                cacheBytes = encodeUtf8(v);
                                return cacheBytes.length;
                            } catch (_) {
                                return -1;
                            }
                        };
                        importObj.env.uk_storage_get_copy = function (kp, kl, op, ol) {
                            try {
                                const k = UTF8ToString(kp, kl);
                                if (cacheKey !== k || !cacheBytes) {
                                    const v = window.localStorage.getItem(k);
                                    if (v === null) return -1;
                                    cacheKey = k;
                                    cacheBytes = encodeUtf8(v);
                                }
                                const n = Math.min(cacheBytes.length, ol);
                                new Uint8Array(wasm_memory.buffer, op, n).set(cacheBytes.subarray(0, n));
                                return n;
                            } catch (_) {
                                return -1;
                            }
                        };
                        importObj.env.uk_storage_set = function (kp, kl, vp, vl) {
                            try {
                                const k = UTF8ToString(kp, kl);
                                const v = UTF8ToString(vp, vl);
                                window.localStorage.setItem(k, v);
                                if (cacheKey === k) {
                                    cacheKey = null;
                                    cacheBytes = null;
                                }
                                return 0;
                            } catch (_) {
                                return -1;
                            }
                        };
                        importObj.env.uk_storage_remove = function (kp, kl) {
                            try {
                                const k = UTF8ToString(kp, kl);
                                window.localStorage.removeItem(k);
                                if (cacheKey === k) {
                                    cacheKey = null;
                                    cacheBytes = null;
                                }
                                return 0;
                            } catch (_) {
                                return -1;
                            }
                        };
                    },
                    version: 1,
                    name: "usakame_storage"
                });

                let gpMasks = [0, 0, 0, 0];
                miniquad_add_plugin({
                    register_plugin: function (importObj) {
                        importObj.env.usakame_gamepad_poll = function () {
                            gpMasks = [0, 0, 0, 0];
                            let count = 0;
                            try {
                                const pads = navigator.getGamepads ? navigator.getGamepads() : [];
                                for (let i = 0; i < pads.length && count < 4; i++) {
                                    const p = pads[i];
                                    if (!p || !p.connected) continue;
                                    let mask = 0;
                                    const b = p.buttons || [];
                                    const ax = p.axes || [];
                                    if ((b[14] && b[14].pressed) || (ax[0] !== undefined && ax[0] < -0.35)) mask |= 1;
                                    if ((b[15] && b[15].pressed) || (ax[0] !== undefined && ax[0] > 0.35)) mask |= 2;
                                    if ((b[12] && b[12].pressed) || (ax[1] !== undefined && ax[1] < -0.35)) mask |= 4;
                                    if ((b[13] && b[13].pressed) || (ax[1] !== undefined && ax[1] > 0.35)) mask |= 8;
                                    if (b[0] && b[0].pressed) mask |= 16;
                                    if (b[1] && b[1].pressed) mask |= 32;
                                    gpMasks[count] = mask;
                                    count++;
                                }
                            } catch (_) {}
                            return count;
                        };
                        importObj.env.usakame_gamepad_mask = function (slot) {
                            return (slot >= 0 && slot < 4) ? gpMasks[slot] : 0;
                        };
                    },
                    version: 1,
                    name: "usakame_gamepad"
                });
            }
        })();
    </script>
    <script>
        const canvasEl = document.getElementById("glcanvas");
        const statusEl = document.getElementById("status");
        canvasEl.focus();
        window.addEventListener("click", () => canvasEl.focus());

        load("uk.wasm");

        // Connect to uk browser hot-reload SSE endpoint if available
        if (typeof EventSource !== "undefined") {
            const es = new EventSource("/__uk_events");
            es.onmessage = (ev) => {
                if (ev.data === "reload") {
                    if (typeof wasm_exports !== "undefined" && wasm_exports.uk_notify_reload) {
                        wasm_exports.uk_notify_reload();
                        statusEl.textContent = "Hot reloaded at " + new Date().toLocaleTimeString();
                    }
                }
            };
            es.onerror = () => {
                // Static hosting or server closed
            };
        }
    </script>
</body>
</html>
