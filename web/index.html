<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usakame Retro Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            color: #fff1e8;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #glcanvas {
            width: min(90vw, 90vh, 640px);
            height: min(90vw, 90vh, 640px);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #5f574f;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            background: #000000;
            outline: none;
        }
        #status {
            margin-top: 8px;
            font-size: 12px;
            color: #c2c3c7;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="status">Usakame Retro Engine (128x128) - Click canvas to focus</div>
    <script src="mq_js_bundle.js"></script>
    <script>
        const canvasEl = document.getElementById("glcanvas");
        const statusEl = document.getElementById("status");
        canvasEl.focus();
        window.addEventListener("click", () => canvasEl.focus());

        load("uk.wasm");

        // Connect to uk browser hot-reload SSE endpoint if available
        if (typeof EventSource !== "undefined") {
            const es = new EventSource("/__uk_events");
            es.onmessage = (ev) => {
                if (ev.data === "reload") {
                    if (typeof wasm_exports !== "undefined" && wasm_exports.uk_notify_reload) {
                        wasm_exports.uk_notify_reload();
                        statusEl.textContent = "Hot reloaded at " + new Date().toLocaleTimeString();
                    }
                }
            };
            es.onerror = () => {
                // Static hosting or server closed
            };
        }
    </script>
</body>
</html>
