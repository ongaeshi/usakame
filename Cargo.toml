[package]
name = "usakame"
version = "0.1.0"
edition = "2024"
default-run = "uk"

[[bin]]
name = "uk"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
mrubyedge = { version = "2.1", features = ["mruby-random"] }
png = "0.17"

# ネイティブ環境（開発・1バイナリ実行）では、実行時にも .rb を直接コンパイルできるようにする
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mruby-compiler2-sys = "0.5"

# ビルド時に game.rb を .mrb バイトコードへ事前コンパイルして埋め込むため（WASM / 1バイナリ配布両対応）
[build-dependencies]
mruby-compiler2-sys = "0.5"

[dev-dependencies]
ttf-parser = "0.25"
png = "0.17"

# Windows (MSVC) 等で libclang 無しでもビルドできるようパッチ済みクレートを適用
[patch.crates-io]
mruby-compiler2-sys = { path = "vendor/mruby-compiler2-sys" }

